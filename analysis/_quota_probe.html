<!doctype html><html><head><meta charset="utf-8"></head><body><script>
function clearAll() { try { localStorage.clear(); } catch(e) {} }

function maxAcceptedLength(ch) {
  clearAll();
  let lo = 0, hi = 12 * 1024 * 1024;
  while (true) {
    try {
      localStorage.setItem('probe', ch.repeat(hi));
      hi *= 2;
      clearAll();
    } catch (e) { break; }
  }
  while (lo < hi) {
    const mid = Math.floor((lo + hi + 1) / 2);
    clearAll();
    try {
      localStorage.setItem('probe', ch.repeat(mid));
      lo = mid;
    } catch (e) {
      hi = mid - 1;
    }
  }
  clearAll();
  return lo;
}

window.__result = {
  asciiLength: maxAcceptedLength('a'),
  sinhalaLength: maxAcceptedLength('ක'),
};
</script></body></html>
